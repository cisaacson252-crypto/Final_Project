[project]
name = "final-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Cole Isaacson", email = "cisaacson252@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.0.0",
    "chromadb>=0.4.0",
    "llama-index-core>=0.10.0",
    "tiktoken>=0.5.0",
    "tqdm>=4.0.0",
    "numpy>=1.24.0",
    "pdfplumber>=0.9.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "lxml>=4.9.0",
    "markitdown>=0.0.1",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
    "matplotlib>=3.7.0",
    "supabase (>=2.29.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]

[tool.poetry]
packages = [{include = "final_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"